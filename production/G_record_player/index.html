<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>六瓣换片机 · 同盘打印</title><style>body{margin:0;background:#111312;color:#eee5d2;font:16px/1.8 system-ui}main{max-width:1450px;margin:auto;padding:38px 26px}h1{font-size:38px;font-weight:450;letter-spacing:.1em}p{max-width:950px;color:#bfb5a1}img{display:block;width:100%;border:1px solid #574831;border-radius:5px}figure{margin:34px 0}figcaption{color:#b9ab90;font-size:14px;margin-top:9px}.status{color:#e5bb73}a{color:#e5bb73}nav{display:flex;gap:24px;flex-wrap:wrap}</style><main><div class="status">概念设计 · 新唱机尚未建模</div><h1>六瓣换片机</h1><p>六片黑色档案盘，旋转盘匣与仿生机械爪。让选片、取片、落盘和读取都成为可以看懂的机械动作。</p><figure><img src="images/G_record_rest_read.png"><figcaption>方向图：大底座上有独立的小读取唱盘，取出的唱片留下对应空槽。</figcaption></figure><h1>唱片留下，藏品打印出来。</h1><p>读完后唱臂让开，物件从同一张唱片表面逐层打印；唱片和物件共同慢转，默认一分钟一圈。操作时停转，停转按钮始终可见。换片先反向回收藏品，再归还原片。</p><figure><img src="images/G_print_sequence.png"><figcaption>读取 → 同盘打印 → 同盘慢转。图稿是制作目标，不能当成已经运行的效果。</figcaption></figure><nav><a href="MECHANISM_PLAN.md">取放顺序与尺寸方案</a><a href="PRINT_AND_ROTATION.md">打印与停转规则</a></nav></main></html>
