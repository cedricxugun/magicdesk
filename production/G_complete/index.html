tive/08_exploded.png"><figcaption>分层抽出 · 机构拆解</figcaption></figure></div><h2>专用视觉资产</h2><figure><img style="max-width:680px" src="../../app/assets/collection/art/G/optical_atlas.png"><figcaption>孔壁焦散 / 扫描细光 / 金属微光 / 记忆刻纹。与真实三维轮廓、写头和局部照明共同合成。</figcaption></figure><p>物理范围：刚体机构运动学与几何光学；不宣称模拟制造公差、材料受力或完整电磁场。图稿、技术验证与最终视觉判断分别保留。</p></main></html>
