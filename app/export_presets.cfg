include_filter="assets/mechanism.json,assets/THIRD_PARTY.txt,assets/pressure_physics/*.json,assets/pressure_physics_ground128/*.json,assets/idle_steam_loop/*.json,assets/collection/*.json,assets/collection/models/*.json,assets/collection/art/*.json"
